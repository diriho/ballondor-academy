<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballon d'Or Academy · Learn web development</title>
<meta name="description" content="Learn web development by building a Ballon d'Or catalogue: HTML, CSS, JavaScript, SQL, Node.js and GitHub, in English and French.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141c18" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<!-- link previews (WhatsApp, iMessage, Discord, Slack…) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ballon d'Or Academy">
<meta property="og:title" content="Ballon d'Or Academy · Learn web development">
<meta property="og:description" content="12 steps, one real project: build a full-stack Ballon d'Or catalogue with HTML, CSS, JavaScript, SQL and Node.js. In English and French.">
<meta property="og:image" content="https://diriho.github.io/ballondor-academy/assets/ballor.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
  // Set the language before anything paints (no flash of both languages)
  (function () {
    var l = 'en';
    try { l = localStorage.getItem('bda-lang') || (navigator.language || '').slice(0, 2); } catch (e) {}
    document.documentElement.lang = l === 'fr' ? 'fr' : 'en';
  })();
  window.Prism = { manual: true };
</script>
<style>
/* Layout: a training-ground notebook — a sticky squad-list rail of numbered steps on the left,
   one lesson at a time on the right, every lesson ending in a checkpoint and a commit. */
:root {
  --paper: #f3f5ef;
  --card: #ffffff;
  --ink: #15201a;
  --muted: #59665e;
  --line: #d6ddd3;
  --gold: #8f6206;
  --gold-fill: #e2b13c;
  --gold-wash: #f7ecd2;
  --pitch: #1b6943;
  --pitch-wash: #e0efe5;
  --danger: #a93b2a;
  --danger-wash: #f8e3de;
  --code-bg: #101914;
  --code-fg: #e2eae4;
  --code-dim: #7f948a;
  --code-line: #24332b;
  --tok-key: #f0c462;
  --tok-str: #8fd6a6;
  --tok-fn: #8cc4ff;
  --tok-num: #f59f7e;
  --tok-tag: #f28fb0;
  --font-display: 'Archivo', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 12px;
  --rail: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1310; --card: #141c18; --ink: #e5ece7; --muted: #93a29a; --line: #26342d;
    --gold: #e8bc52; --gold-fill: #e2b13c; --gold-wash: #2b2412; --pitch: #5cc98f; --pitch-wash: #11271b;
    --danger: #ef8a78; --danger-wash: #2e1713; --code-bg: #09100c; --code-line: #1c2922;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1310; --card: #141c18; --ink: #e5ece7; --muted: #93a29a; --line: #26342d;
  --gold: #e8bc52; --gold-fill: #e2b13c; --gold-wash: #2b2412; --pitch: #5cc98f; --pitch-wash: #11271b;
  --danger: #ef8a78; --danger-wash: #2e1713; --code-bg: #09100c; --code-line: #1c2922;
  color-scheme: dark;
}

/* ---------- language switching ---------- */
html[lang="en"] [data-l="fr"], html[lang="fr"] [data-l="en"] { display: none !important; }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
a { color: var(--pitch); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold-fill); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.88em; }
:not(pre) > code { background: var(--gold-wash); padding: 0.1em 0.35em; border-radius: 5px; overflow-wrap: anywhere; }
td code { overflow-wrap: normal; }
kbd { font-family: var(--font-mono); font-size: 0.82em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0.05em 0.4em; background: var(--card); }
button { font: inherit; color: inherit; }
.display { font-family: var(--font-display); font-stretch: 68%; font-weight: 850; text-transform: uppercase; letter-spacing: 0.01em; }
.eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-size: 1.35rem; line-height: 1; }
.brand b { color: var(--gold); font-weight: inherit; }
.ball { width: 24px; height: 24px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff6d4 0 12%, #f2c84f 30%, #b47f12 75%, #6e4a05 100%);
  box-shadow: inset -2px -3px 5px rgb(0 0 0 / 0.25); }
.progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-track { width: 120px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress-track span { display: block; height: 100%; width: 0; background: var(--gold-fill); transition: width 0.4s ease; }
/* "See the final app": the finished catalogue, live on Vercel */
.final-link { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px 6px 8px; border-radius: 99px;
  border: 1px solid var(--gold-fill); background: var(--gold-wash); color: var(--ink);
  font-size: 0.82rem; font-weight: 700; line-height: 1.3; text-decoration: none; white-space: nowrap; }
.final-link:hover { background: var(--gold-fill); color: #241903; }
.final-link .ball { width: 16px; height: 16px; }
.final-link .fl-short { display: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.lang { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 99px; }
.lang button { border: 0; background: none; padding: 4px 11px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- shell: rail + main ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - 56px); }
.rail { position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 57px); overflow-y: auto;
  border-right: 1px solid var(--line); padding: 20px 14px 32px max(14px, env(safe-area-inset-left, 0px)); }
.rail h2 { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 0 8px 8px; }
.rail ol { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 0.92rem; line-height: 1.25; }
.rail a:hover { background: var(--pitch-wash); }
.rail a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.rail a small { display: block; color: var(--muted); font-size: 0.75rem; }
.rail a[aria-current="page"] small { color: inherit; opacity: 0.7; }

/* jersey: the step number printed on a shirt */
.jersey { flex: none; width: 34px; height: 32px; display: grid; place-items: center; padding-top: 6px;
  clip-path: polygon(26% 0, 40% 7%, 60% 7%, 74% 0, 100% 16%, 90% 38%, 80% 33%, 80% 100%, 20% 100%, 20% 33%, 10% 38%, 0 16%);
  background: var(--line); color: var(--ink); font-family: var(--font-display); font-stretch: 70%; font-weight: 800; font-size: 0.95rem; }
.jersey.done { background: var(--gold-fill); color: #241903; }
.rail a[aria-current="page"] .jersey:not(.ref) { background: var(--pitch); color: #fff; }
.jersey.ref { background: transparent; clip-path: none; padding-top: 0; }

main { min-width: 0; padding-block: 36px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; scroll-margin-top: 240px; } /* opening a shared #step-N link lands on the title, not under the sticky bars */
.view[hidden] { display: none; }
.view > *, .prose > * { min-width: 0; }
.prose { display: grid; gap: 14px; max-width: 70ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

/* ---------- welcome ---------- */
.hero { display: grid; gap: 18px; }
.hero h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 0.92; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero .lede { font-size: 1.15rem; color: var(--muted); max-width: 60ch; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 0.95rem; text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: 6px 12px; font-size: 0.82rem; }
.btn.gold { background: var(--gold-fill); border-color: var(--gold-fill); color: #241903; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn[hidden] { display: none; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.fact { border-top: 3px solid var(--gold-fill); padding-top: 10px; display: grid; gap: 4px; }
.fact strong { font-size: 1rem; }
.fact span { color: var(--muted); font-size: 0.9rem; }

.roadmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; list-style: none; margin: 0; padding: 0; }
.roadmap a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); text-decoration: none; color: var(--ink); font-size: 0.9rem; line-height: 1.25; height: 100%; }
.roadmap a:hover { border-color: var(--pitch); }
.roadmap small { display: block; color: var(--muted); }

/* ---------- mini browser frame (demo of the final app) ---------- */
.browser { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #0c0e13; box-shadow: 0 18px 40px rgb(10 20 14 / 0.18); }
.browser-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #1b2029; color: #a3a9b8; font-size: 0.78rem; font-family: var(--font-mono); }
.browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a4150; }
.browser-bar span { margin-left: 8px; background: #0f1218; padding: 3px 10px; border-radius: 6px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demo { color: #f3efe6; padding: 18px; display: grid; gap: 14px; font-family: var(--font-body); }
.demo-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.demo h3 { font-family: var(--font-display); font-stretch: 70%; font-weight: 800; text-transform: uppercase; font-size: 1.9rem; line-height: 1; color: #e6b94d; flex: 1 1 100%; }
.demo input { flex: 1 1 200px; min-width: 0; background: #151922; border: 1px solid #2a3142; color: #f3efe6; border-radius: 99px; padding: 8px 14px; font: inherit; font-size: 0.9rem; }
.demo .seg { display: flex; background: #151922; border: 1px solid #2a3142; border-radius: 99px; padding: 3px; }
.demo .seg button { border: 0; background: none; color: #a3a9b8; padding: 5px 12px; border-radius: 99px; cursor: pointer; font-size: 0.85rem; }
.demo .seg button[aria-pressed="true"] { background: #1d2330; color: #e6b94d; }
.demo-status { font-size: 0.82rem; color: #a3a9b8; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
.dcard { background: #151922; border: 1px solid #2a3142; border-radius: 10px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
.dcard:hover { transform: translateY(-3px); border-color: #e6b94d; }
.dcard .m { position: relative; aspect-ratio: 4 / 5; background: #1d2330; }
.dcard img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.dcard .m::after { content: ""; position: absolute; inset: 55% 0 0; background: linear-gradient(transparent, rgb(12 14 19 / 0.9)); }
.dcard .y { position: absolute; left: 8px; bottom: 2px; z-index: 1; font-family: var(--font-display); font-stretch: 70%; font-weight: 800; font-size: 1.7rem; color: #e6b94d; }
.dcard .b { padding: 8px 10px 10px; font-size: 0.78rem; line-height: 1.3; }
.dcard .b strong { display: block; font-size: 0.86rem; }
.dcard .b span { color: #a3a9b8; }

/* ---------- lesson header ---------- */
.lesson-head { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: flex-end; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.lesson-head .lh { display: grid; gap: 8px; min-width: 0; flex: 1 1 260px; }
.big-number { font-family: var(--font-display); font-stretch: 62%; font-weight: 900; font-size: clamp(4.5rem, 12vw, 7.5rem); line-height: 0.8; color: var(--gold-fill); }
.lesson-head h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 0.95; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.78rem; padding: 3px 10px; border-radius: 99px; background: var(--pitch-wash); color: var(--pitch); font-weight: 600; }

h2.sec { font-size: 1.45rem; display: flex; align-items: baseline; gap: 10px; }
h2.sec::before { content: ""; width: 14px; height: 3px; background: var(--gold-fill); flex: none; transform: translateY(-6px); }
h3.sub { font-size: 1.08rem; }

/* callouts: role encoded by colour + label */
.callout { border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; border: 1px solid var(--line); background: var(--card); }
.callout > .label { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
.callout.goal { background: var(--gold-wash); border-color: transparent; }
.callout.goal > .label { color: var(--gold); }
.callout.check { background: var(--pitch-wash); border-color: transparent; }
.callout.check > .label { color: var(--pitch); }
.callout.warn { background: var(--danger-wash); border-color: transparent; }
.callout.warn > .label { color: var(--danger); }
.callout.tip > .label { color: var(--pitch); }
.callout ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

details.challenge { border: 1px dashed var(--gold); border-radius: var(--radius); padding: 14px 18px; background: var(--card); }
details.challenge > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; gap: 10px; align-items: center; }
details.challenge > summary::-webkit-details-marker { display: none; }
details.challenge > summary::before { content: "+"; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--gold-fill); color: #241903; font-weight: 800; flex: none; }
details.challenge[open] > summary::before { content: "–"; }
details.challenge > div { margin-top: 12px; display: grid; gap: 10px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
tr:last-child td { border-bottom: 0; }

/* ---------- code blocks ---------- */
.code { border-radius: var(--radius); overflow: hidden; background: var(--code-bg); color: var(--code-fg); min-width: 0; }
.code-bar { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; border-bottom: 1px solid var(--code-line); font-family: var(--font-mono); font-size: 0.78rem; color: var(--code-dim); }
.code-bar .file { color: var(--tok-key); }
.code-bar .note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy { margin-left: auto; border: 1px solid var(--code-line); background: transparent; color: var(--code-fg); border-radius: 7px; padding: 3px 10px; font-size: 0.75rem; cursor: pointer; font-family: var(--font-body); }
.copy:hover { border-color: var(--code-dim); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.6; tab-size: 2; }
.code pre code { background: none; padding: 0; font-size: inherit; }
.code.collapsed pre { max-height: 260px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.expand { display: block; width: 100%; border: 0; border-top: 1px solid var(--code-line); background: transparent; color: var(--tok-key); padding: 8px; cursor: pointer; font-size: 0.8rem; }
.token.comment, .token.prolog, .token.doctype { color: var(--code-dim); font-style: italic; }
.token.keyword, .token.important, .token.atrule, .token.rule { color: var(--tok-key); }
.token.string, .token.attr-value, .token.url, .token.regex { color: var(--tok-str); }
.token.function, .token.class-name, .token.selector { color: var(--tok-fn); }
.token.number, .token.boolean, .token.constant, .token.unit { color: var(--tok-num); }
.token.tag, .token.property, .token.attr-name { color: var(--tok-tag); }
.token.punctuation, .token.operator { color: #b8c6bd; }
.token.variable { color: var(--tok-num); }

/* terminal */
.term .code-bar::before { content: "$_"; color: var(--tok-str); font-weight: 600; }

/* ---------- playground ---------- */
.play { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); display: grid; }
.play-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.play-head strong { font-size: 0.85rem; margin-right: auto; }
.tabs { display: flex; gap: 2px; background: var(--paper); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.play-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 360px; }
.play textarea { width: 100%; height: 100%; min-height: 360px; resize: vertical; border: 0; border-right: 1px solid var(--line); padding: 12px 14px; background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55; tab-size: 2; outline: none; }
.play iframe { width: 100%; height: 100%; min-height: 360px; border: 0; background: #fff; }

/* ---------- widgets ---------- */
.widget { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.widget-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.widget-title strong { font-size: 1rem; }
.widget-title span { color: var(--muted); font-size: 0.85rem; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls label { display: grid; gap: 2px; font-size: 0.78rem; color: var(--muted); }
.controls select, .controls input[type="range"] { font: inherit; font-size: 0.85rem; }
.controls select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }

/* git simulator */
.git-zones { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.zone > div { display: grid; gap: 6px; min-width: 0; }
.zone { min-width: 0; border: 1px dashed var(--line); border-radius: 10px; padding: 10px; min-height: 120px; display: grid; align-content: start; gap: 6px; background: var(--paper); }
.zone h4 { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.zone h4 code { text-transform: none; }
.pill { font-family: var(--font-mono); font-size: 0.74rem; padding: 3px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: pop 0.3s ease; }
.pill.mod { border-color: var(--gold-fill); }
.pill.commit { border-color: var(--pitch); color: var(--pitch); }
@keyframes pop { from { transform: scale(0.85); opacity: 0; } }

/* box model */
.bm-stage { display: grid; place-items: center; padding: 10px; background: var(--paper); border-radius: 10px; overflow: hidden; }

/* flex lab */

/* SQL lab + API explorer */
.sql-editor { width: 100%; min-height: 120px; resize: vertical; border: 0; border-radius: 10px; padding: 12px 14px; background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.55; }

.result { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }

.msg { font-size: 0.85rem; color: var(--muted); }

.challenges { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.api-row { display: flex; gap: 8px; flex-wrap: wrap; }
.api-row input { flex: 1 1 260px; min-width: 0; font-family: var(--font-mono); font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.json-out { margin: 0; max-height: 320px; overflow: auto; background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 12px 14px; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.5; }

.diagram { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 12px; }

.credits td:first-child { white-space: nowrap; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
