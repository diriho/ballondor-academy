# Publishes the course to GitHub Pages: https://diriho.github.io/ballondor-academy/
# Every push to main rebuilds course-site/index.html and redeploys (about 1 minute).
name: Deploy course site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs, as recommended by actions/deploy-pages: "deploy" starts only once "build"
# has finished, so the uploaded site is guaranteed to be there when it is published.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Rebuild so the lessons always match the code in ballondor-catalogue/
      - name: Build the course page
        run: python3 course-site/build.py
      # Publish only what the browser needs, at the root of the site (not build.py or src/)
      - name: Collect site files
        run: |
          mkdir _site
          cp course-site/index.html _site/
          cp -R course-site/assets _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
