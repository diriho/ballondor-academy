# Publishes two websites to GitHub Pages:
#   https://diriho.github.io/ballondor-academy/            → the course (course-site/)
#   https://diriho.github.io/ballondor-academy/catalogue/  → the finished app (ballondor-catalogue/)
#
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that, every push to main that touches the course or the project redeploys both sites.
name: Deploy websites

on:
  push:
    branches: [main]
    paths:
      - "course-site/**"
      - "ballondor-catalogue/**"
      - "deploy/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rebuilds the course from its sources + makes the static copy of the app → _site/
      - name: Build both sites
        run: python3 deploy/build_pages.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
